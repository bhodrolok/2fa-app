[package]
name = "appcore"
version = "1.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
aegis = { version = "0.9.20", features = ["std", "pure-rust"] }
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
crypto-common = { version = "0.2.2", features = ["zeroize"] }
data-encoding = "2.11.1"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
jni = "0.22.4"
percent-encoding = "2.3.2"
resvg = "0.48.1"
rqrr = "0.11.0"
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = { version = "0.11.0", features = ["zeroize"] }
sha2 = { version = "0.11.0", features = ["zeroize"] }
sha3 = { version = "0.11.0", features = ["zeroize"] }
zeroize = { version = "1.9.0", features = ["derive"] }
zxcvbn = "3.1.1"
