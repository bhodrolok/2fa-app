[package]
name = "appcore"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
debug-assertions = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
data-encoding = "2.9.0"
getrandom = "0.3.4"
hmac = "0.12.1"
jni = "0.21.1"
percent-encoding = "2.3.2"
scrypt = "0.11.0"
serde_json = "1.0.149"
sha1 = "0.10.6"
sha2 = "0.10.9"
sha3 = "0.10.8"
url = "2.5.7"
