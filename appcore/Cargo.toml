[package]
name = "appcore"
version = "1.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
aegis = { version = "0.9.8", default-features = false, features = ["std", "pure-rust"] }
aes-gcm = "0.10.3"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
data-encoding = "2.11.0"
getrandom = "0.4.2"
hkdf = "0.13.0"
hmac = "0.13.0"
jni = "0.22.4"
percent-encoding = "2.3.2"
resvg = "0.47.0"
scrypt = "0.12.0"
serde_json = "1.0.149"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.11.0"
url = "2.5.8"
zeroize = "1.8.2"
zxcvbn = "3.1.1"
