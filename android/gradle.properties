org.gradle.jvmargs=-Xmx8192m -Xms2048m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.compiler.execution.strategy=in-process

# release only
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.r8.strictFullModeForKeepRules=true

android.enableAppCompileTimeRClass=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.builtInKotlin=true
android.newDsl=true

android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

android.experimental.lint.daemon.memory=2048
